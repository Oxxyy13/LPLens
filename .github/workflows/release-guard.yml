name: Release guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan the public tree for credentials
        run: node tools/check-repo-secrets.mjs
      - name: Prove the credential matchers
        run: |
          node tools/check-repo-secrets.mjs --self-test
          node tools/test-package-guard.mjs
          node tools/test-development-fence-package-guard.mjs
          node tools/test-retired-chart-marker-package-guard.mjs
      - name: Run relay and accounting regressions
        run: |
          node tools/test-privacy-disclosure.mjs
          node tools/test-diagnostics-telemetry.mjs
          node tools/test-overlay-list.mjs
          node tools/test-overlay-panel-layout.mjs
          node tools/test-projectx-overlay.mjs
          node tools/test-active-projectx-wallet.mjs
          node tools/test-projectx-config.mjs
          node tools/test-up33-config.mjs
          node tools/test-up33-direct-pnl.mjs
          node tools/test-up33-transfer-source.mjs
          node tools/test-up33-overlay.mjs
          node tools/test-up33-row-overlay.mjs
          node tools/test-up33-current-refresh.mjs
          node tools/test-dexscreener-overlay.mjs
          node tools/test-dexscreener-range.mjs
          node tools/test-dexscreener-pair-cache.mjs
          node tools/test-dexscreener-revocation.mjs
          node tools/test-dexscreener-main-bridge.mjs
          node tools/test-dexscreener-chart-overlay.mjs
          node tools/test-price-orientation.mjs
          node tools/test-hidden-positions.mjs
          node tools/test-chain-preferences.mjs
          node tools/test-current-position-index.mjs
          node tools/test-current-position-refresh.mjs
          node tools/test-refresh-deltas.mjs
          node tools/test-position-lineage.mjs
          node tools/test-portfolio-presentation.mjs
          node tools/test-sidepanel.mjs
          node tools/test-blockscout-relay.mjs
          node tools/test-rpc-retry.mjs
          node tools/test-robinhood-rpc-batch.mjs
          node tools/test-transient-cache-retry.mjs
          node tools/test-history-cache-v2.mjs
          node tools/test-histprice-archive.mjs
          node tools/test-histprice-blockscout.mjs
          node tools/test-last-log-retry.mjs
          node tools/test-v4-history.mjs
          node tools/test-v4-ownership-cache.mjs
          node tools/test-v4-ownership-checkpoint.mjs
          node tools/test-mutation-refresh.mjs
          node tools/test-cashflow-pnl.mjs
      - name: Build the byte-identical extension tree
        run: |
          node tools/package.mjs --skip-live-probe
          version=$(node -p "require('./extension/manifest.json').version")
          diff -r extension "build/lplens-$version"
